<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bookie – My Reading List</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ───────────── HEADER ───────────── -->
  <header class="header">
    <div class="header-inner">
      <div class="logo">
        <span class="logo-icon">📚</span>
        <span class="logo-text">Bookie</span>
      </div>
      <button class="btn btn-primary" id="openAddModal">+ Add Book</button>
    </div>
  </header>

  <!-- ───────────── HERO STRIP ───────────── -->
  <div class="hero-strip">
    <div class="stat-card">
      <span class="stat-number" id="totalCount">0</span>
      <span class="stat-label">Total Books</span>
    </div>
    <div class="stat-card">
      <span class="stat-number" id="readCount">0</span>
      <span class="stat-label">Read</span>
    </div>
    <div class="stat-card">
      <span class="stat-number" id="unreadCount">0</span>
      <span class="stat-label">Unread</span>
    </div>
  </div>

  <!-- ───────────── MAIN CONTENT ───────────── -->
  <main class="main">

    <!-- Search + Filter bar -->
    <div class="toolbar">
      <div class="search-wrap">
        <span class="search-icon">🔍</span>
        <input
          type="text"
          id="searchInput"
          class="search-input"
          placeholder="Search by title or author…"
        />
        <button class="clear-search hidden" id="clearSearch">✕</button>
      </div>
      <div class="filter-tabs">
        <button class="tab active" data-filter="all">All</button>
        <button class="tab" data-filter="read">Read</button>
        <button class="tab" data-filter="unread">Unread</button>
      </div>
    </div>

    <!-- Book list -->
    <div id="bookList" class="book-list"></div>

    <!-- Empty state -->
    <div id="emptyState" class="empty-state hidden">
      <div class="empty-icon">📖</div>
      <h2 class="empty-title">Your shelf is empty!</h2>
      <p class="empty-sub">Hit <strong>+ Add Book</strong> to start building your reading list.</p>
    </div>

    <!-- No search results -->
    <div id="noResults" class="empty-state hidden">
      <div class="empty-icon">🔎</div>
      <h2 class="empty-title">No matches found</h2>
      <p class="empty-sub">Try a different title or author name.</p>
    </div>

  </main>

  <!-- ───────────── ADD / EDIT MODAL ───────────── -->
  <div class="modal-overlay hidden" id="modalOverlay">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-header">
        <h2 class="modal-title" id="modalTitle">Add a New Book</h2>
        <button class="modal-close" id="closeModal" aria-label="Close">✕</button>
      </div>
      <form id="bookForm" novalidate>
        <input type="hidden" id="bookId" />

        <div class="form-group">
          <label for="bookTitle">Title <span class="required">*</span></label>
          <input
            type="text"
            id="bookTitle"
            class="form-input"
            placeholder="e.g. Atomic Habits"
            maxlength="120"
            required
          />
          <span class="error-msg" id="titleError"></span>
        </div>

        <div class="form-group">
          <label for="bookAuthor">Author <span class="required">*</span></label>
          <input
            type="text"
            id="bookAuthor"
            class="form-input"
            placeholder="e.g. James Clear"
            maxlength="100"
            required
          />
          <span class="error-msg" id="authorError"></span>
        </div>

        <div class="form-group">
          <label class="toggle-label" for="bookRead">
            <span>Mark as Read</span>
            <div class="toggle-wrap">
              <input type="checkbox" id="bookRead" class="toggle-input" />
              <span class="toggle-track">
                <span class="toggle-thumb"></span>
              </span>
            </div>
          </label>
        </div>

        <div class="modal-actions">
          <button type="button" class="btn btn-ghost" id="cancelModal">Cancel</button>
          <button type="submit" class="btn btn-primary" id="saveBtn">Save Book</button>
        </div>
      </form>
    </div>
  </div>

  <!-- ───────────── CONFIRM DELETE DIALOG ───────────── -->
  <div class="modal-overlay hidden" id="confirmOverlay">
    <div class="modal modal-sm" role="alertdialog" aria-modal="true">
      <div class="modal-header">
        <h2 class="modal-title">Delete Book?</h2>
      </div>
      <p class="confirm-msg">Are you sure you want to remove <strong id="confirmBookTitle"></strong> from your shelf? This can't be undone.</p>
      <div class="modal-actions">
        <button class="btn btn-ghost" id="cancelDelete">Keep It</button>
        <button class="btn btn-danger" id="confirmDelete">Yes, Delete</button>
      </div>
    </div>
  </div>

  <!-- Toast notification -->
  <div class="toast hidden" id="toast"></div>

  <script src="script.js"></script>
</body>
</html>
